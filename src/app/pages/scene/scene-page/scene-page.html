<!-- scene-page.html -->
<div class="flex h-full w-full min-h-0">

  <div class="flex flex-col w-1/4 min-w-0 h-full border-r border-[var(--theme-color-border)]">
    <app-hierarchy-panel class="flex-1 min-h-0 border-b border-[var(--theme-color-border)]"></app-hierarchy-panel>
    <app-inspector-panel class="flex-1 min-h-0 border-b border-[var(--theme-color-border)]"></app-inspector-panel>
  </div>

  <div class="flex flex-col flex-1 min-w-0 min-h-0 h-full">
    <app-workspaces class="flex-1 min-w-0 min-h-0"></app-workspaces>
    <app-console-panel class="block h-1/4 min-h-[120px] shrink-0 border-t border-[var(--theme-color-border)]"></app-console-panel>
  </div>

  <div class="flex flex-col w-1/4 min-w-0 h-full border-l border-[var(--theme-color-border)]">
    <app-file-tree-panel class="flex-1 min-h-0"></app-file-tree-panel>
    <app-file-inspector-panel class="flex-1 min-h-0"></app-file-inspector-panel>
  </div>

</div>
