<div class="flex flex-col gap-6">

    <p class="text-sm text-gray-600 dark:text-gray-400">
      {{ message() }}
    </p>
  
    <div class="flex items-center gap-2 justify-end">
      <p-button
        label="No"
        severity="secondary"
        [text]="true"
        (click)="cancelled.emit()">
      </p-button>
      <p-button
        label="Yes"
        severity="danger"
        (click)="confirmed.emit()">
      </p-button>
    </div>
  
  </div>
