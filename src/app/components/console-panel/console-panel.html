<!-- bottom-panel.html -->
<div class="flex flex-col h-full min-h-0 bg-neutral-900">

    <!-- Tab bar (same look as the workspace tabs) -->
    <div class="flex items-end h-8 shrink-0 border-b border-[var(--theme-color-border)]">
      @for (tab of tabs; track tab.id) {
        <div
          (click)="activate(tab)"
          class="relative flex items-center gap-2 px-3 h-full border-r border-[var(--theme-color-border)]
                 cursor-pointer select-none transition-colors shrink-0"
          [ngClass]="tab.id === activeTab()
            ? 'bg-[var(--theme-color-border)] text-gray-900 dark:text-white'
            : 'dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'">
  
          @if (tab.id === activeTab()) {
            <span class="absolute top-0 left-0 right-0 h-[1px]" [style.background-color]="'var(--theme-color)'"></span>
          }
  
          <i [class]="tab.icon + ' text-xs shrink-0'"></i>
          <span class="text-xs">{{ tab.title }}</span>
        </div>
      }
    </div>
  
    <!-- Both panels stay alive; the inactive one is just hidden, so the terminal keeps its draft and scroll position -->
    <div class="flex-1 min-h-0 relative">
      <app-terminal-component class="absolute inset-0" [showInput]="false" [class.hidden]="activeTab() !== 'console'" />
      <app-terminal-component class="absolute inset-0" [hideStartupOutput]="true" [class.hidden]="activeTab() !== 'terminal'" />
    </div>
  
  </div>
