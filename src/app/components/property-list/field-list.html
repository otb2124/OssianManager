<div class="flex flex-col gap-3">
  @for (field of visibleFields(); track field.path) {
    @switch (field.kind) {
      @case ('text') {
        <app-input-text-control
          [label]="field.label"
          [type]="field.inputType ?? 'text'"
          [maxlength]="field.maxlength ?? null"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-input-text-control>
      }
      @case ('number') {
        <app-input-number-control
          [label]="field.label"
          [step]="field.step ?? 1"
          [min]="field.min ?? null"
          [max]="field.max ?? null"
          [minFractionDigits]="field.minFractionDigits ?? 0"
          [maxFractionDigits]="field.maxFractionDigits ?? 2"
          [prefix]="field.prefix"
          [suffix]="field.suffix"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-input-number-control>
      }
      @case ('select') {
        <app-select-control
          [label]="field.label"
          [options]="field.options"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-select-control>
      }
      @case ('boolean') {
        <app-boolean-control
          [label]="field.label"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-boolean-control>
      }
      @case ('resource-picker') {
        <app-resource-picker-control
          [label]="field.label"
          [itemName]="getValue(field.path)"
          [actions]="field.actions"
          (actionSelected)="onResourceAction(field.path, $event)">
        </app-resource-picker-control>
      }
      @case ('vector') {
        <app-vector-control
          [label]="field.label"
          [value]="getValue(field.path)"
          [step]="field.step ?? 0.1"
          [displayScale]="field.displayScale ?? 1"
          [axisLabels]="field.axisLabels ?? ['X', 'Y', 'Z']"
          [min]="field.min ?? null"
          [max]="field.max ?? null"
          [minFractionDigits]="field.minFractionDigits ?? 0"
          [maxFractionDigits]="field.maxFractionDigits ?? 2"
          [prefix]="field.prefix"
          [suffix]="field.suffix">
        </app-vector-control>
      }
      @case ('color') {
        <app-color-picker-control
          [label]="field.label"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-color-picker-control>
      }
      @case ('tags') {
        <app-tag-select-control
          [label]="field.label"
          [ngModel]="getValue(field.path)"
          (ngModelChange)="setValue(field.path, $event)">
        </app-tag-select-control>
      }
    }
  }
</div>
