<!-- terminal-panel.html -->
<div class="flex flex-col h-full min-h-0 bg-neutral-900 text-xs">

    @if (!showInput()) {
      <!-- Console mode: read-only, so it needs its own clear button -->
      <div class="flex items-center justify-between px-2 py-1 border-b border-[var(--theme-color-border)] shrink-0">
        <span class="text-gray-400 select-none">Engine console</span>
        <p-button
          icon="pi pi-trash"
          (onClick)="clear()"
          severity="secondary"
          size="small"
          [text]="true"
          styleClass="!p-1"
          title="Clear" />
      </div>
    }
  
    <div
      #output
      (scroll)="onScroll()"
      (click)="onOutputClick()"
      class="flex-1 min-h-0 overflow-auto px-2 py-1 font-mono leading-5">
      @if (hideStartupOutput() && !ready() && visibleLines().length === 0) {
        <div class="text-gray-500 italic">Waiting for the engine to finish loading…</div>
      }
      @for (line of visibleLines(); track line.id) {
        <!-- single line on purpose: whitespace-pre-wrap would render template indentation -->
        <div class="whitespace-pre-wrap break-all" [ngClass]="lineClass(line.stream)">@if (line.stream === 'input') {<span class="select-none">&gt; </span>}{{ line.text }}</div>
      }
    </div>
  
    @if (showInput()) {
      <div class="flex items-center gap-2 px-2 py-1.5 border-t border-[var(--theme-color-border)] shrink-0 font-mono">
        <span class="text-[var(--theme-color)] select-none">&gt;</span>
        <input
          #prompt
          type="text"
          [value]="draft()"
          (input)="onInput($event)"
          (keydown.enter)="submit()"
          (keydown)="onKeydown($event)"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="Type a command and press Enter"
          class="flex-1 min-w-0 bg-transparent text-neutral-200 placeholder:text-neutral-600 focus:outline-none" />
      </div>
    }
  
  </div>
