<!-- file-inspector-panel.html -->
<div class="flex flex-col gap-3 p-3 h-full overflow-auto text-xs">

    <div *ngIf="!selected()" class="text-gray-400 dark:text-gray-500 italic">
      No file selected
    </div>
  
    <ng-container *ngIf="selected() as entry">
  
      <div class="flex items-center gap-2 pb-2 border-b border-[var(--theme-color-border)]">
        <i [class]="(entry.isDirectory ? 'pi pi-folder' : 'pi pi-file') + ' shrink-0'"></i>
  
        <span *ngIf="!renaming()" class="font-medium truncate">{{ entry.name }}</span>
        <input
          *ngIf="renaming()"
          pInputText
          type="text"
          [(ngModel)]="renameValue"
          (keydown.enter)="confirmRename()"
          (keydown.escape)="cancelRename()"
          class="w-full px-1.5 py-1 rounded bg-[var(--theme-color-muted)] outline-none" />
      </div>
  
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between">
          <span class="text-gray-400 dark:text-gray-500">Path</span>
          <span class="truncate max-w-[60%]" [title]="entry.path">{{ entry.path }}</span>
        </div>
        <div class="flex justify-between" *ngIf="!entry.isDirectory">
          <span class="text-gray-400 dark:text-gray-500">Size</span>
          <span>{{ formattedSize() }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400 dark:text-gray-500">Modified</span>
          <span>{{ formattedModified() }}</span>
        </div>
      </div>
  
      <div class="flex flex-col gap-1">
        <span class="text-gray-400 dark:text-gray-500">Build Action</span>
        <div class="px-1.5 py-1 rounded bg-[var(--theme-color-muted)] text-gray-400 dark:text-gray-500 italic">
            //
        </div>
      </div>
  
      <div class="flex gap-2 pt-2">
        <p-button *ngIf="!renaming()" (click)="startRename()" label="Rename" [text]="true" size="small"></p-button>
        <p-button *ngIf="renaming()" (click)="confirmRename()" label="Save" [text]="true" size="small"></p-button>
        <p-button *ngIf="renaming()" (click)="cancelRename()" label="Cancel" [text]="true" size="small"></p-button>
      </div>
  
    </ng-container>
  
  </div>
