<!-- transform-control.html -->
<div class="flex flex-col gap-3">
    <app-vector-control label="Position" [value]="transformNode.position" [step]="0.1"></app-vector-control>
    <app-vector-control label="Rotation" [value]="transformNode.rotation" [step]="1" [displayScale]="radToDeg"></app-vector-control>
    <app-vector-control label="Scale" [value]="transformNode.scaling" [step]="0.1"></app-vector-control>
  </div>
