<!-- transform-control.html -->
<div class="flex flex-col gap-3">
    <app-vector3-field label="Position" [value]="transformNode.position" [step]="0.1"></app-vector3-field>
    <app-vector3-field label="Rotation" [value]="transformNode.rotation" [step]="1" [displayScale]="radToDeg"></app-vector3-field>
    <app-vector3-field label="Scale" [value]="transformNode.scaling" [step]="0.1"></app-vector3-field>
  </div>
