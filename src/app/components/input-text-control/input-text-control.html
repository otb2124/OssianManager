<div class="flex flex-col gap-1 w-full">
  <p-floatlabel variant="on" class="w-full">
    <input
      pInputText
      [type]="type"
      [readonly]="readonly"
      [maxlength]="maxlength"
      [placeholder]="placeholder"
      [ngModel]="value"
      (ngModelChange)="onChange($event)"
      id="text-input-{{label}}"
      class="w-full px-1.5 py-1 rounded outline-none text-sm" />

    <label for="text-input-{{label}}">
      {{ label }}
    </label>
  </p-floatlabel>
</div>
