<!-- inspector-panel.html -->
<div class="flex flex-col gap-3 p-3 h-full overflow-auto text-xs">

    <div *ngIf="!sceneService.selectedNode()" class="text-gray-400 dark:text-gray-500 italic">
      No object selected
    </div>
  
    <ng-container *ngIf="sceneService.selectedNode() as node">
  
      <div class="flex items-center gap-2 pb-2 border-b border-[var(--theme-color-border)]">
        <i class="pi pi-box shrink-0"></i>
        <span class="font-medium truncate">{{ nodeName() }}</span>
      </div>
  
      <div *ngIf="!transformNode()" class="text-gray-400 dark:text-gray-500 italic">
        This node has no transform properties
      </div>
  
      <ng-container *ngIf="transformNode() as t">
        <app-vector3-field label="Position" [value]="t.position" [step]="0.1"></app-vector3-field>
        <app-vector3-field label="Rotation" [value]="t.rotation" [step]="1" [displayScale]="radToDeg"></app-vector3-field>
        <app-vector3-field label="Scale" [value]="t.scaling" [step]="0.1"></app-vector3-field>
      </ng-container>
  
    </ng-container>
  
  </div>
