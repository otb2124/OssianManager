<!-- components/inspector-panel/inspector-panel.html -->
<div class="flex flex-col gap-3 p-3 h-full overflow-auto text-xs">

  @if (!sceneService.selectedNode()) {
    <div class="text-gray-400 dark:text-gray-500 italic">
      No object selected
    </div>
  }

  @if (sceneService.selectedNode(); as node) {
    <!-- Selected Object Header -->
    <div class="flex items-center gap-2 pb-2 border-b border-[var(--theme-color-border)]">
      <i class="pi pi-box shrink-0"></i>
      <span class="font-medium truncate">{{ nodeName() }}</span>
    </div>

    <!-- Re-creations forced on selection change using a tracked 1-item loop -->
    @for (key of [inspectorSync.selectionKey()]; track key) {
      @if (inspectorSync.fieldTarget(); as target) {
        <app-field-list 
          [fields]="inspectorFields" 
          [target]="target">
        </app-field-list>
      }
    }
  }

</div>
