<div class="p-4 flex flex-col gap-4">

    @if (projectService.hasConfig()) {
      <div class="flex flex-col gap-2">
        <span class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-wide font-medium">Project Config</span>
        <div class="flex flex-col gap-1 text-sm text-gray-700 dark:text-gray-300">
          <div class="flex items-center gap-2">
            <span class="text-gray-400 dark:text-gray-500 w-24 shrink-0">Project ID</span>
            <span class="font-mono">{{ projectService.currentConfig()?.projectRecord?.id }}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-gray-400 dark:text-gray-500 w-24 shrink-0">Target</span>
            <span class="font-mono">{{ projectService.currentConfig()?.targetDirectory }}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-gray-400 dark:text-gray-500 w-24 shrink-0">Resources</span>
            <span class="font-mono">{{ projectService.currentConfig()?.resDirectory }}</span>
          </div>
        </div>
      </div>
    } @else {
      <span class="text-sm text-gray-400 dark:text-gray-500">No config loaded.</span>
    }
  
  </div>
