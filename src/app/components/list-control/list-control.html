<div class="flex flex-col gap-1.5 w-full">
    <!-- List Label -->
    @if (label) {
      <span class="text-xs font-medium text-gray-400 dark:text-gray-500">{{ label }}</span>
    }
  
    <div class="flex flex-wrap items-center gap-2 w-full">
      <!-- Existing Items -->
      @for (item of value; track $index; let i = $index) {
        <div class="group relative flex items-center min-w-[120px] max-w-xs pr-6 rounded border border-transparent hover:border-surface-300 dark:hover:border-surface-600 transition-colors">
          
          <!-- Rendered Control -->
          <div class="w-full">
            <app-field-list
              [fields]="getItemFieldConfig(i)"
              [model]="getItemModel(i)"
              [hideLabels]="true"
              direction="horizontal"
              (modelChange)="onModelChange(i, $event)">
            </app-field-list>
          </div>
  
          <!-- Hover Remove Button (Cross Icon) -->
          @if (!readonly) {
            <button
              type="button"
              class="absolute right-1 opacity-0 group-hover:opacity-100 transition-opacity p-1 text-gray-400 hover:text-red-500 rounded-full focus:outline-none"
              (click)="removeItem(i)"
              title="Remove item">
              <i class="pi pi-times text-xs"></i>
            </button>
          }
        </div>
      }
  
      <!-- Add Button (+) -->
      @if (!readonly) {
        <p-button
          icon="pi pi-plus"
          [rounded]="true"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="addItem()"
          pTooltip="Add item"
          tooltipPosition="top">
        </p-button>
      }
    </div>
  </div>
