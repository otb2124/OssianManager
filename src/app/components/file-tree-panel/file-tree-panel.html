<!-- file-tree-panel.html -->
<div class="flex flex-col h-full">
  <div class="flex items-center justify-between px-2 py-1.5 border-b border-[var(--theme-color-border)] shrink-0">
    <span class="text-xs text-gray-400 dark:text-gray-500 truncate">
      {{ explorerService.rootPath() ?? 'No folder' }}
    </span>
    <p-button (onClick)="browseFolder()" [text]="true" icon="pi pi-folder-open" size="small"></p-button>
  </div>

  <div class="flex-1 min-h-0 p-2 overflow-auto">
    <app-tree-control
      [nodes]="rootNodes()"
      [config]="treeConfig"
      (nodeSelect)="onNodeSelect($event)">
    </app-tree-control>
  </div>
</div>
