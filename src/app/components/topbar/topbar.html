<div class="flex w-full items-stretch">
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <app-url-control class="shrink-0"></app-url-control>
    <app-module-control class="shrink-0"></app-module-control>

    <div class="flex items-center h-10 border-b border-[var(--theme-color-border)] w-full min-w-0">
      @if (projectService.hasProject()) {
        <a
          (click)="goToProject()"
          class="text-sm font-medium text-[var(--theme-color)] px-4 h-full flex items-center shrink-0 hover:underline cursor-pointer">
          {{ projectService.projectName() }}
        </a>
      } @else {
        <span class="text-sm font-medium text-gray-400 dark:text-gray-500 px-4 h-full flex items-center shrink-0">
          No current project
        </span>
      }
      <div class="flex-1 min-w-0 overflow-x-auto scrollbar-none h-full">
        <app-tabs-control></app-tabs-control>
      </div>
    </div>
  </div>

  <app-title class="flex shrink-0 self-stretch border-l border-[var(--theme-color-border)]"></app-title>
</div>
