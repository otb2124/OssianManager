<div class="flex flex-col h-full w-full min-h-0 bg-transparent">

  <!-- Tab Bar Header -->
  <div class="flex items-end h-9 shrink-0 border-b border-[var(--theme-color-border)]">
    <div
      *ngFor="let tab of tabs()"
      (click)="activateTab(tab)"
      class="group relative flex items-center gap-2 px-3 h-full border-r border-[var(--theme-color-border)]
             cursor-pointer select-none transition-colors shrink-0 min-w-0 max-w-[180px]"
      [ngClass]="tab.path === activeTab()
        ? 'bg-[var(--theme-color-border)] text-gray-900 dark:text-white'
        : 'dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'">

      <span
        *ngIf="tab.path === activeTab()"
        class="absolute top-0 left-0 right-0 h-[1px]"
        [style.background-color]="'var(--theme-color)'">
      </span>

      <i *ngIf="tab.icon" [class]="tab.icon + ' text-xs shrink-0'"></i>
      <span class="text-sm truncate">{{ tab.title }}</span>

      <button
        (click)="closeTab(tab, $event)"
        class="shrink-0 w-4 h-4 flex items-center justify-center rounded
               opacity-0 group-hover:opacity-100 transition-opacity ml-1
               hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none"
        [class.opacity-100!]="tab.path === activeTab()">
        <i class="pi pi-times text-[10px]"></i>
      </button>
    </div>
  </div>

  <!-- Content Container with Viewport Overlay -->
  <div class="flex-1 min-h-0 min-w-0 relative bg-transparent">
    
    <!-- Overlay tabs -->
    @switch (activeTab()) {
      @case ('3d-viewport') {
        <app-viewport3d></app-viewport3d>
      }
      @case ('2d-viewport') {
        <div class="absolute inset-0 bg-neutral-900 z-10">
          <app-viewport2d></app-viewport2d>
        </div>
      }
      @case ('script') {
        <div class="absolute inset-0 bg-neutral-900 z-10">
          <app-script-editor></app-script-editor>
        </div>
      }
      @case ('render') {
        <div class="absolute inset-0 bg-neutral-900 z-10"></div>
      }
    }
  </div>

</div>
