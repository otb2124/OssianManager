<div class="flex items-center gap-2">

    <p-button
      label="New"
      icon="pi pi-plus"
      severity="secondary"
      [text]="true"
      (click)="openCreateDialog()">
    </p-button>
  
    <p-button
      label="Import"
      icon="pi pi-folder-open"
      severity="secondary"
      [text]="true"
      (click)="importProject()">
    </p-button>
  
    <p-button
      label="Scan"
      icon="pi pi-search"
      severity="secondary"
      [text]="true"
      (click)="scanForProjects()">
    </p-button>
  
  </div>
  
  <app-dialog-wrapper
    header="New Project"
    [(visible)]="showCreateDialog">
    <app-project-record-form
      (submitted)="onCreateSubmitted($event)"
      (cancelled)="showCreateDialog = false">
    </app-project-record-form>
  </app-dialog-wrapper>
