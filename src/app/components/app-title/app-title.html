<div
  class="flex items-center gap-3 px-4 shrink-0 cursor-default h-full"
  (mouseenter)="onTriggerEnter($event)"
  (mouseleave)="onTriggerLeave($event)">

  <img src="assets/logo.png" alt="logo" class="w-16 h-16 object-contain shrink-0">

  <div class="flex flex-col gap-1">
  
    <div class="flex flex-col"> 
      <span class="text-sm font-semibold text-[var(--theme-color)] leading-tight">{{ appConfigService.appTitle() }}</span>
      <span class="flex items-center gap-1.5 leading-tight">
        <span class="flex items-center gap-1 leading-tight">
          <span
            class="px-1.5 py-px rounded font-medium text-white"
            [style.background-color]="'var(--theme-color)'"
            [style.color]="'white'">
            {{ appConfigService.version() }}
          </span>
          <span
            *ngFor="let tag of appConfigService.versionTags()"
            class="px-1.5 py-px rounded font-medium"
            [style.background-color]="'var(--theme-color-muted)'"
            [style.color]="'white'">
            {{ tag }}
          </span>
        </span>
      </span>
    </div>
  
    <div class="flex flex-col"> 
      <span class="text-sm font-semibold text-[var(--theme-color)] leading-tight">{{ engineConfigService.appTitle() }}</span>
      <span class="flex items-center gap-1.5 leading-tight">
        <span
            class="px-1.5 py-px rounded font-medium text-white"
            [style.background-color]="'var(--theme-color)'"
            [style.color]="'white'">
            {{ engineConfigService.version() }}
          </span>
          <span
            *ngFor="let tag of engineConfigService.versionTags()"
            class="px-1.5 py-px rounded font-medium"
            [style.background-color]="'var(--theme-color-muted)'"
            [style.color]="'white'">
            {{ tag }}
          </span>
      </span>
    </div>
  
  </div>
</div>
