<!-- file-tree-node.html — row div gets a click handler and selected-state styling -->
<div
  (click)="select($event)"
  class="flex items-center gap-1.5 px-1.5 py-1 rounded text-xs cursor-pointer select-none transition-colors
         hover:bg-[var(--theme-color-muted)]"
  [class.font-medium]="explorerService.isSelected(entry)"
  [style.color]="explorerService.isSelected(entry) ? 'var(--theme-color)' : null">

  <i
    (click)="toggleExpanded($event)"
    *ngIf="entry.isDirectory; else spacer"
    class="pi pi-chevron-right text-[10px] shrink-0 w-3 transition-transform"
    [class.rotate-90]="expanded()">
  </i>
  <ng-template #spacer><span class="w-3 shrink-0"></span></ng-template>

  <i [class]="(entry.isDirectory ? 'pi pi-folder' : 'pi pi-file') + ' text-xs shrink-0'"></i>
  <span class="truncate">{{ entry.name }}</span>
</div>
  
<div class="pl-4" *ngIf="expanded()">
  <div *ngIf="loading()" class="px-1.5 py-1 text-gray-400 dark:text-gray-500 italic text-xs">Loading…</div>
  <app-file-tree-node
    *ngFor="let child of children()"
    [entry]="child">
  </app-file-tree-node>
</div>
