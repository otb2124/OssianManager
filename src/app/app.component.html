<div class="app-container relative h-screen overflow-hidden">

  @if (bg.enabled()) {
    <app-shader-background
      [shader]="bg.shader()"
      [values]="bg.values()"
      [speed]="bg.speed()"
      [quality]="bg.quality()"
      [themeColor]="bg.themeColor()"
      (compileError)="bg.reportError($event)" />

    <div class="pointer-events-none absolute inset-0 bg-black"
         [style.opacity]="bg.dim()"></div>
  }

  <div class="relative z-10 flex h-full flex-col">

    <app-topbar></app-topbar>

    <div class="flex flex-1 min-h-0">
      <!--<app-sidebar-nav></app-sidebar-nav>-->
      <main class="flex-1 overflow-auto">
        <router-outlet></router-outlet>
      </main>
    </div>

    <app-bottombar></app-bottombar>

    <app-dialog-form></app-dialog-form>
    <p-toast position="bottom-right"></p-toast>
    <app-context-menu></app-context-menu>
  </div>
</div>
